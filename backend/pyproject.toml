[project]
name = "agentops"
version = "0.1.0"
description = "AgentOps backend: chat API with streaming and a replaceable LLM provider"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "google-genai>=2.33.0",
    "langgraph>=1.2.17",
    "mcp>=2.3.0",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4", "PL"]
ignore = ["PLR0911", "PLR0913", "PLR2004", "S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415", "PT012"]
"alembic/**" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentops"]
mypy_path = "src"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["integration: needs a reachable PostgreSQL at DATABASE_URL (auto-skipped otherwise)"]
addopts = "-ra --strict-markers"
