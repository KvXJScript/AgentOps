name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan full history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agentops
          POSTGRES_PASSWORD: agentops
          POSTGRES_DB: agentops
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentops -d agentops"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://agentops:agentops@localhost:5433/agentops
      # No provider keys in CI: everything model-related runs against fakes.
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: Integration tests (fail instead of skipping when the DB is missing)
        run: make test-integration
        env:
          REQUIRE_DB: "1"
      - name: Cache the fastembed model (~220 MB) for evals
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: Evals (real local embeddings, scripted model; never --live)
        run: make eval
        env:
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
          EMBEDDING_CACHE_DIR: ${{ runner.temp }}/fastembed
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/evals/reports/latest.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
